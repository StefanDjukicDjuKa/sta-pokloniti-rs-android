name: Build ŠTA POKLONITI RS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Podesi Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Podesi Android SDK
        uses: android-actions/setup-android@v4

      - name: Instaliraj Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Dozvoli Gradle wrapper
        run: chmod +x ./gradlew

      - name: Napravi APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Preimenuj APK
        run: cp app/build/outputs/apk/debug/app-debug.apk STA_POKLONITI_RS.apk

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: STA_POKLONITI_RS_APK
          path: STA_POKLONITI_RS.apk
          if-no-files-found: error
